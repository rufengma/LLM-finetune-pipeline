# Multi-GPU training config for `accelerate launch` (single node, DDP).
#
# Generated for accelerate 1.x; validate with:
#   python -c "from accelerate.commands.config.config_args import ClusterConfig; \
#       print(ClusterConfig.from_yaml_file('configs/accelerate_multi_gpu.yaml'))"
#
# Launch a run with it (no code changes needed — src/train.py uses the
# standard HuggingFace Trainer, which accelerate drives under the hood):
#   accelerate launch --config_file configs/accelerate_multi_gpu.yaml \
#       src/train.py --config configs/recommended.yaml
#
# Set num_processes to the number of GPUs on your machine first
# (check with `nvidia-smi -L`). To regenerate interactively instead, run
# `accelerate config` and answer the prompts; it writes default_config.yaml.

compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
mixed_precision: bf16
use_cpu: false
debug: false
num_processes: 2
machine_rank: 0
num_machines: 1
gpu_ids: null
main_process_ip: null
main_process_port: null
rdzv_backend: static
same_network: true
main_training_function: main
enable_cpu_affinity: false
downcast_bf16: 'no'
